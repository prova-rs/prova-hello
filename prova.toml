# One manifest, two hats. In Prova a package is one prova.toml-rooted unit; this one both exports a
# namespace (a plugin — `[package]`) and runs its own proofs (a suite). Author the plugin in
# init.lua; prove it in proofs/; ship both together.
[package]
name        = "hello"
description = "Hello — the registry lifecycle demo plugin (create → release → registered → removed)"
license     = "MIT"

# The range of prova versions this plugin is built against; a consumer is checked against it.
[requires]
prova = ">= 0.16"

# Resolve THIS plugin from its own directory, so the self-tests can `require("hello")` exactly as

# a consumer would. A CONSUMER instead pins it by source — a released tag:
#   hello = { git = "https://github.com/prova-rs/prova-hello", tag = "v1" }

[dependencies]
hello = { path = "." }
