# The plugin proves itself: proofs/ runs against the plugin resolved from this very checkout
# (prova.toml pins `hello = { path = "." }`), exactly as a consumer would require it.
name: test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prova-rs/run-action@v1
        with:
          version: v0.11.0
